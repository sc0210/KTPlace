# The Linux development container: the repository mounted live at /workspace,
# reached over SSH on localhost:2222. Works the same from macOS, Windows and
# Linux:
#
#   docker compose up -d --build          # any OS, PowerShell included
#   ssh -p 2222 dev@127.0.0.1             # Windows 10+ ships this ssh client
#
# scripts/devenv.sh wraps the same steps for a bash shell (macOS, Linux, WSL,
# Git Bash) and picks whichever SSH key you have.

# Fixed, so the volumes are the same whatever the clone's directory is called;
# compose otherwise names them after the directory.
name: ktplace

services:
  dev:
    build:
      context: .
      target: dev
    image: ktplace-dev
    container_name: ktplace-dev
    hostname: ktplace-dev
    ports:
      # Loopback only: the container is reachable from this machine, not the LAN.
      - "127.0.0.1:${KTPLACE_SSH_PORT:-2222}:22"
    volumes:
      # Edits on the host are seen in the container immediately, and the other
      # way round.
      - .:/workspace
      # The Linux build trees are volumes laid over the repository's build/
      # and build-cov/, so the container keeps its compiler artifacts while
      # the sources stay live on the host. The volumes persist builds across
      # `docker compose down` and `up`.
      - build:/workspace/build
      - build-cov:/workspace/build-cov
      # SSH host keys live in a named volume so `ssh -p 2222 dev@127.0.0.1`
      # does not warn about changed host keys every time the container is
      # recreated. Mounted at /var/lib/ktplace-ssh to match where the
      # entrypoint and sshd configuration read and write the key
      # (docker/dev-entrypoint.sh, Dockerfile).
      - ssh-host-keys:/var/lib/ktplace-ssh
      # The public key allowed to log in. Compose expands ~ to the home
      # directory on every OS; point KTPLACE_SSH_PUBKEY elsewhere for another
      # key. Long form for create_host_path: false -- with the short form, a
      # missing key file makes Docker create an empty *directory* at that path
      # on the host, inside ~/.ssh, instead of failing.
      - type: bind
        source: ${KTPLACE_SSH_PUBKEY:-~/.ssh/id_ed25519.pub}
        target: /run/ktplace/authorized_keys
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  # The web console: runs ktplace inside the container and serves the results.
  web:
    build:
      context: .
      target: web
    image: ktplace-web
    container_name: ktplace-web
    hostname: ktplace-web
    ports:
      - "127.0.0.1:${KTPLACE_WEB_PORT:-8080}:8080"
    volumes:
      # The engine: the same build volume the dev container writes, so the
      # console runs the binary that tree compiled -- one compile, shared by
      # the shell and the browser, not one per image.
      - build:/ktplace/build
      # The host's whole benchmark suite, read-only, so every design is
      # selectable rather than only the vendored adaptec1. A standalone
      # `docker run` keeps the vendored copy; this only adds to it.
      - ./benchmark:/ktplace/benchmark:ro
      # Runs survive `down`/restarts; the server also adopts existing runs on
      # start, so history persists.
      - web-runs:/ktplace/runs
    environment:
      # The in-page command runner is a shell in this container, so it is off by
      # default. On here for local development: the port is loopback-only, and
      # the server refuses requests whose Host/Origin is not localhost or that
      # are not JSON, so a web page you visit cannot drive it (CSRF, DNS
      # rebinding). Reaching the console under another name needs
      # KTPLACE_WEB_ALLOWED_HOSTS.
      KTPLACE_WEB_ALLOW_EXEC: "1"
    restart: unless-stopped

volumes:
  build:
  build-cov:
  ssh-host-keys:
  web-runs:
